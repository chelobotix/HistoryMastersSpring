spring.application.name=historical_figures

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/historical_figures}
spring.datasource.username=${DB_USERNAME:historical_figures}
spring.datasource.password=${DB_PASSWORD:historical_figures}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — schema managed by Flyway only
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
