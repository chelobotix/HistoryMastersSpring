<!doctype html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Document</title>
    </head>
    <body>
    <h1 th:text="#{home.welcome}">Welcome to HOME!!!</h1>
    <form method="post" th:action="@{/users/update_locale}">
        <select name="locale" onchange="this.form.submit()">
            <option value="en" th:selected="${#locale.language == 'en'}">English</option>
            <option value="es" th:selected="${#locale.language == 'es'}">Español</option>
            <option value="pt" th:selected="${#locale.language == 'pt'}">Português</option>
        </select>
    </form>
        <div sec:authorize="isAuthenticated()">
            <p>Welcome, <span sec:authentication="name"></span>!</p>
        </div>
        <div sec:authorize="!isAuthenticated()">
            <a href="/login">Login</a>
        </div>
    </body>
</html>
