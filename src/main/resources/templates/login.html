<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" th:href="@{/css/new_user.css}">
</head>
<body>
<main class="sign-up-page">
    <section class="sign-up-card">
        <h1>Iniciar sesión</h1>
        <p class="subtitle">Introduce tus credenciales para acceder.</p>

        <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/login}" method="post" class="sign-up-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-group">
                <label for="username">Correo electrónico</label>
                <input type="email" id="username" name="username" placeholder="tu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
            </div>

            <button type="submit" class="btn-submit">Entrar</button>
        </form>

        <p class="login-link">
            ¿No tienes cuenta?
            <a th:href="@{/users/register}">Regístrate</a>
        </p>
    </section>
</main>
</body>
</html>
