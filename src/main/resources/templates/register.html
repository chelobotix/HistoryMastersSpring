<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" th:href="@{/css/new_user.css}">
</head>
<body>
<main class="sign-up-page">
    <section class="sign-up-card">
        <h1>Crear cuenta</h1>
        <p class="subtitle">Completa el formulario para registrarte.</p>

        <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/users/register}" th:object="${userCreateRequest}" method="post" class="sign-up-form">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" th:field="*{email}" placeholder="tu@email.com" required>
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Mínimo 6 caracteres" required>
                <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>

            <button type="submit" class="btn-submit">Registrarse</button>
        </form>

        <p class="login-link">
            ¿Ya tienes cuenta?
            <a th:href="@{/login}">Inicia sesión</a>
        </p>
    </section>
</main>
</body>
</html>
