services:
  postgres:
    image: postgres:16-alpine
    container_name: historical_figures-postgres
    environment:
      TZ: UTC
      POSTGRES_DB: ${DB_NAME:-historical_figures}
      POSTGRES_USER: ${DB_USERNAME:-historical_figures}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-historical_figures}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-historical_figures} -d ${DB_NAME:-historical_figures}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: historical_figures-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
